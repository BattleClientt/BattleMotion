org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g
# org.gradle.configuration-cache stays OFF — evaluated and rejected 2026-07-09
# (Gradle 9.6.1). Two reasons, one fixable and one structural: (1) storing the
# entry fails today on the four verification-gate tasks (script-object
# references in apiCompat/verifyDowngrade/verifyJdk8Api, a captured
# Configuration in verifyJdk8Api) — fixable, but only by refactoring the gates
# themselves; (2) the integration run/check pairs mint their freshness nonce
# at CONFIGURATION time, so a reused cache entry would freeze the nonce across
# invocations and a stale PASS could masquerade as the current run's — the
# exact dishonesty the nonce exists to prevent. Enabling it requires moving
# nonce minting to execution time (through a file handoff between run and
# check) plus notCompatibleWithConfigurationCache on the gate tasks, for a
# saving of a few seconds of configuration per invocation. Not worth touching
# the honesty seam.

# THE version — the single source of truth. The root build reads it into every
# module; core's processResources expands it into plugin.yml.
# Battle Motion — fork do Mental 2.12.0-beta (commit 8c6cc73). Historico das
# versoes do Mental: project/docs/UPSTREAM-HISTORY.md.
# Battle Motion usa linha propria de versoes (1.x) — nunca reutilize um nome de tag ja publicado.

# The supported-platform matrix (versions, JDKs, CI lanes) lives
# in support-matrix.json at the repo root — THE single source of truth. There
# is deliberately no version list here anymore.

# The public api artifact's own semver (dev.battleclient:battlemotion-api). Independent of the
# plugin version below by design: the api surface evolves additively and slower.
# 3.2.0 is the Mental gen-3 surface Battle Motion forked from.
apiVersion=3.2.0
version=1.0.0-beta.1
